version: 2
registries:
  n2k02-updater:
    type: maven-repository
    url: https://maven.pkg.github.com/N2K02/n2k02updater
    username: ${{secrets.N2K02_PACKAGES_USER}}
    password: ${{secrets.N2K02_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: gradle
    directory: "/"
    registries:
      - n2k02-updater
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "dev.n2k02:updater"
    labels:
      - dependencies
