name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, one decimal place (e.g. 2.0). Leave empty to add 0.1 to the last release.'
        required: false
        default: ''

permissions:
  contents: write

# Cancel superseded builds for the same PR or main branch; each PR is independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP: MRadio

jobs:
  build:
    # Release-signing secrets are never exposed to PRs from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags, for the version number and release notes

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure APK build channel
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "BUILD_VARIANT=Debug" >> "$GITHUB_ENV"
            echo "APK_INPUT=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          else
            echo "BUILD_VARIANT=Release" >> "$GITHUB_ENV"
            echo "APK_INPUT=app/build/outputs/apk/release/app-release-unsigned.apk" >> "$GITHUB_ENV"
          fi

      - name: Test public version resolution
        run: bash .github/scripts/test-public-version.sh

      - name: Work out version and release notes
        env:
          REQUESTED: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The public website repository carries the stable releases, even though
          # this source repository is private. Read its tags to avoid repeating 1.0.
          # Legacy version before distribution migration was 3.7; never reset to 1.x.
          MIGRATION_BASELINE="3.7"
          local_last=$(git tag -l 'v[0-9]*' | sed -nE 's/^v([0-9]+[.][0-9])$/\1/p' | sort -V | tail -1 || true)
          # Read the complete app-specific public tag history, including build-N tags.
          public_last=$(bash .github/scripts/latest-public-version.sh mradio)
          public_last="${public_last#v}"
          last=$(printf '%s\n%s\n%s\n' "$MIGRATION_BASELINE" "$local_last" "$public_last" | sort -V | tail -1)
          if [ -n "$REQUESTED" ]; then
            echo "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]$' || { echo "::error::Version must look like 1.0"; exit 1; }
            ver="$REQUESTED"
          elif [ -z "$last" ]; then
            ver="1.0"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # PR APKs stay on the latest stable base and get an experimental suffix.
            ver="$last"
          else
            n=$(( ${last%.*} * 10 + ${last#*.} + 1 ))
            ver="$(( n / 10 )).$(( n % 10 ))"
          fi
          # PR APKs may share the latest stable version with an experimental suffix.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -n "$last" ]; then
            max=$(printf '%s\n%s\n' "$last" "$ver" | sort -V | tail -1)
            if [ "$max" != "$ver" ] || [ "$last" = "$ver" ]; then
              echo "::error::Release $ver must advance past $last"; exit 1
            fi
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( 100000 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "APK_NAME=$APP-PR-${{ github.event.pull_request.number }}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "APK_NAME=$APP-$ver" >> "$GITHUB_ENV"
          fi
          echo "Version: $ver (previous stable: ${last:-none})"

          # Release notes = commit titles since the previous release (or the last old-style build).
          prev=""
          if [ -n "$last" ]; then
            # The public distribution tag may not exist locally. For a changelog,
            # use a local source tag only when it exists.
            git rev-parse -q --verify "refs/tags/v$last" >/dev/null && prev="v$last" || true
          fi
          [ -n "$prev" ] || prev=$(git tag -l 'build-*' | sort -V | tail -1 || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          changes=$(git log --no-merges --pretty='- %s' $range | head -40)
          [ -n "$changes" ] || changes="- Rebuild, no code changes"
          {
            echo "## $APP $ver"
            echo "Version code: $(( 100000 + GITHUB_RUN_NUMBER ))"
            echo
            echo "### What's new"
            echo "$changes"
            echo
            echo "### Install"
            echo "Download the APK below and install it on your phone."
            echo
            echo "_Built from \`${GITHUB_SHA::7}\`${prev:+ · changes since \`$prev\`}_"
          } > release-notes.md
          cat release-notes.md

      - name: Verify unit tests and Android lint
        env:
          N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug || {
            echo "::group::Android lint findings"
            if [ -f app/build/reports/lint-results-debug.txt ]; then
              cat app/build/reports/lint-results-debug.txt
            else
              echo "Lint text report not generated"
            fi
            echo "::endgroup::"
            exit 1
          }

      - name: Build APK
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
          N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
        run: |
          echo "Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          chmod +x gradlew
          set -o pipefail
          VERSION_SUFFIX=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            VERSION_SUFFIX="-experimental.$GITHUB_RUN_NUMBER"
          fi
          EXTRA_FLAGS=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${{ github.head_ref }}" = "feature/integrate-theme-and-updater" ]; then
            test -n "$N2K02_PACKAGES_TOKEN" || { echo "::error::Missing private package token"; exit 1; }
            EXTRA_FLAGS=(-PuseSharedUpdater=true -PuseSharedTheme=true)
          fi
          ./gradlew --no-daemon testDebugUnitTest assemble$BUILD_VARIANT -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE" -PappVersionSuffix="$VERSION_SUFFIX" "${EXTRA_FLAGS[@]}" 2>&1 | tee build.log || {
            # One annotation with the full error text (GitHub caps annotations per step at 10).
            msg=$(grep -E '^e: |error:|What went wrong|Dependency .* requires|compileSdk|Android Gradle plugin' -A3 build.log | head -80 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Build failed::$msg"
            exit 1
          }
          # Sign with the app's private key. It is stored encrypted in signing/keys.tar.enc and
          # unlocked with the SIGNING_PASSPHRASE repository secret, only for this step.
          # Key rotation: Android 9+ moves from the old (public test) key to the private key with
          # a signed proof, so installed apps keep updating without reinstalling; the old key
          # can no longer push updates there.
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::error title=Missing signing secret::Add the SIGNING_PASSPHRASE secret: repo Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          K="$RUNNER_TEMP/keys"; mkdir -p "$K"; chmod 700 "$K"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/keys.tar.enc -pass env:SIGNING_PASSPHRASE | tar -xf - -C "$K"
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          export RP=$(cat "$K/release.pass") OP=android
          "$BT/apksigner" rotate --out "$K/lineage" \
            --old-signer --ks "$K/old.keystore" --ks-pass env:OP --ks-key-alias androiddebugkey --key-pass env:OP \
            --new-signer --ks "$K/release.p12" --ks-pass env:RP --ks-key-alias release --key-pass env:RP
          # GitHub turns spaces in download names into dots, so the file is "<App>-<version>.apk".
          "$BT/apksigner" sign \
            --ks "$K/old.keystore" --ks-pass env:OP --ks-key-alias androiddebugkey --key-pass env:OP \
            --next-signer --ks "$K/release.p12" --ks-pass env:RP --ks-key-alias release --key-pass env:RP \
            --lineage "$K/lineage" --rotation-min-sdk-version 28 \
            --out "$APK_NAME.apk" $APK_INPUT
          rm -rf "$K"
          "$BT/apksigner" verify --print-certs "$APK_NAME.apk" | grep -E "Signer.*(DN|SHA-256 digest)"

      # Preserve the signed APK even if optional public distribution is unavailable.
      - name: Upload signed APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}.apk
          if-no-files-found: error

      - name: Publish signed APK to private MRadio Releases
        # Private releases are visible to repository collaborators only.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            tag="experimental-pr-$PR_NUMBER-run-$GITHUB_RUN_NUMBER"
            title="mRadio experimental · PR #$PR_NUMBER · build #$GITHUB_RUN_NUMBER"
            target="$PR_HEAD_SHA"
            extra=(--prerelease --latest=false)
          else
            tag="v$VERSION"
            title="mRadio $VERSION"
            target="$GITHUB_SHA"
            extra=(--latest)
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              gh release upload "$tag" "$APK_NAME.apk" --repo "$GITHUB_REPOSITORY" --clobber
              echo "Experimental release asset updated: $tag"
            else
              echo "::error::Stable release tag $tag already exists. Use a new version."
              exit 1
            fi
          else
            gh release create "$tag" "$APK_NAME.apk" \
              --repo "$GITHUB_REPOSITORY" --target "$target" \
              --title "$title" --notes-file release-notes.md "${extra[@]}"
            echo "Private release created: $tag"
          fi

      - name: Check public distribution configuration
        id: distribution
        env:
          DIST_TOKEN: ${{ secrets.ANDROID_DISTRIBUTION_TOKEN }}
        run: |
          if [ -n "$DIST_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_DISTRIBUTION_TOKEN is not available. Signed APK is preserved as a workflow artifact, but the public stable/experimental update channels cannot be published until the secret is configured in this repository."
          fi

      - name: Publish stable or experimental APK to public distribution
        if: steps.distribution.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.ANDROID_DISTRIBUTION_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/publish-distribution.sh
