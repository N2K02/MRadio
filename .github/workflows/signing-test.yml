name: Signing test (temporary)
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/signing-test.yml' ]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test key rotation signing with throwaway keys
        run: |
          set -x
          exec > >(tee .github/signing-test-result.txt) 2>&1
          openssl version
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1); echo "build-tools: $BT"
          "$BT/apksigner" version
          K="$RUNNER_TEMP/keys"; mkdir -p "$K/b"
          cp app/debug.keystore "$K/b/old.keystore"
          export KP=$(openssl rand -hex 24)
          keytool -genkeypair -storetype PKCS12 -keystore "$K/b/release.p12" -alias release -keyalg RSA -keysize 4096 -validity 11000 -storepass "$KP" -keypass "$KP" -dname "CN=test" >/dev/null
          echo -n "$KP" > "$K/b/release.pass"
          export SIGNING_PASSPHRASE=throwaway-test-passphrase
          tar -C "$K/b" -cf - release.p12 release.pass old.keystore | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:SIGNING_PASSPHRASE -out "$RUNNER_TEMP/keys.tar.enc"
          # ---- exactly what the build will do ----
          D="$RUNNER_TEMP/dec"; mkdir -p "$D"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$RUNNER_TEMP/keys.tar.enc" -pass env:SIGNING_PASSPHRASE | tar -xf - -C "$D"
          export RP=$(cat "$D/release.pass"); export OP=android
          curl -sSL -o in.apk "https://github.com/N2K02/MRadio/releases/latest/download/$(curl -sSL https://api.github.com/repos/N2K02/MRadio/releases/latest | python3 -c 'import sys,json;print(json.load(sys.stdin)["assets"][0]["name"])')"
          ls -la in.apk
          "$BT/apksigner" rotate --out "$D/lineage" \
            --old-signer --ks "$D/old.keystore" --ks-pass env:OP --ks-key-alias androiddebugkey --key-pass env:OP \
            --new-signer --ks "$D/release.p12" --ks-pass env:RP --ks-key-alias release --key-pass env:RP
          "$BT/apksigner" sign \
            --ks "$D/old.keystore" --ks-pass env:OP --ks-key-alias androiddebugkey --key-pass env:OP \
            --next-signer --ks "$D/release.p12" --ks-pass env:RP --ks-key-alias release --key-pass env:RP \
            --lineage "$D/lineage" --rotation-min-sdk-version 28 \
            --out out.apk in.apk
          "$BT/apksigner" verify --verbose --print-certs out.apk | head -40
          "$BT/apksigner" lineage --in out.apk --print-certs -v | head -30 || true
          echo RESULT=OK
      - name: Save result
        if: always()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -f .github/signing-test-result.txt && git commit -qm "signing test result [skip ci]" && git push
